[package]
name = "core"
version = "0.2.0"
edition = "2021"

# 자기 패키지의 bin들이 lib를 참조할 때 내장 `core` 크레이트와 충돌하지 않도록
# lib 타깃 이름을 코드에서 쓰는 이름(core_lib)으로 맞춘다 — src-tauri의
# `core_lib = { package = "core" }` 별칭과도 일치.
[lib]
name = "core_lib"

# 지식 조회 MCP 서버(stdio)와 아카이브 백필 CLI — 앱과 별개로 실행되는 얇은
# 바이너리. 로직은 lib 모듈(mcp·archive·knowledge·claude_cli)에 살고 여기는 진입점만.
[[bin]]
name = "knowledge-mcp"
path = "src/bin/knowledge_mcp.rs"

[[bin]]
name = "archive-backfill"
path = "src/bin/archive_backfill.rs"

[dependencies]
# `killpg` only — a one-shot `codex exec` spawns its own children (MCP servers,
# hooks), so a timeout must kill the whole process group, not just the leader.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gitignore-aware traversal + project-wide search (ripgrep's crates).
# `ignore` walks directories honoring .gitignore (used by `fs::list_dir` to drop
# node_modules/target/etc. and by the search module); `globset` matches glob
# queries (e.g. *.rs); `grep-searcher`/`grep-regex` do fast in-file content search.
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
portable-pty = "0.9"
# Native SSH client (no system `ssh`/`sshpass` dependency). russh 0.50+ merged
# russh-keys into `russh::keys`. Runs on a tokio runtime encapsulated inside the
# SSH session thread; SessionManager's public API stays synchronous.
russh = "0.54"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }

# The remote end-to-end test (`tests/remote_ssh.rs`) stands up a **real** SSH
# server in-process and talks to a **real** `cwcd` daemon through it, so it
# needs the same two crates the client side uses. Same versions as above, so
# nothing extra is compiled; they are repeated here only because an integration
# test cannot reach a crate's ordinary dependencies.
[dev-dependencies]
russh = "0.54"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time", "io-util", "process"] }
libc = "0.2"
